{% extends 'base.html' %}

{% block title %}Редактирование книги - {{ book.title }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 750px;">
    <div class="d-flex align-items-center mb-4">
        <a href="{{ url_for('admin') }}#books" class="btn btn-light rounded-circle me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="mb-0 fw-bold">Редактирование книги</h2>
    </div>
    
    <div class="card shadow-sm border-0 rounded-4">
        <div class="card-body p-4 p-md-5">
            <form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST">
                
                <div class="mb-3">
                    <label for="title" class="form-label fw-semibold">Название книги <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-book"></i></span>
                        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="author" class="form-label fw-semibold">Автор</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="author" name="author" value="{{ book.author or '' }}">
                        </div>
                    </div>
                    
                    <div class="col-md-4 mb-3">
                        <label for="publication_year" class="form-label fw-semibold">Год издания</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-calendar3"></i></span>
                            <input type="number" class="form-control" id="publication_year" name="publication_year" value="{{ book.publication_year or '' }}">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="cover_image" class="form-label fw-semibold">URL обложки (ссылка на картинку)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-image"></i></span>
                        <input type="url" class="form-control" id="cover_image" name="cover_image" placeholder="https://..." value="{{ book.cover_image or '' }}">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="link" class="form-label fw-semibold">Ссылка на скачивание или источник</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-link-45deg"></i></span>
                        <input type="url" class="form-control" id="link" name="link" placeholder="https://..." value="{{ book.link or '' }}">
                    </div>
                </div>
                
                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold">Описание книги</label>
                    <textarea class="form-control" id="description" name="description" rows="6" placeholder="Краткое содержание или аннотация...">{{ book.description or '' }}</textarea>
                    <div class="form-text">Поддерживаются внутренние ссылки вида <code>[[Название материала]]</code>.</div>
                </div>
                
                <div class="d-flex justify-content-end gap-2">
                    <a href="{{ url_for('admin') }}#books" class="btn btn-light px-4 rounded-pill">Отмена</a>
                    <button type="submit" class="btn btn-main px-4 rounded-pill shadow-sm">
                        <i class="bi bi-check2-circle me-1"></i> Сохранить изменения
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
